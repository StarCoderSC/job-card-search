<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Card Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <h1>Akuk Old Job Card Yanphen</h1>
            <p>Kyong mying shilo erana tona Job Card Number ji hungka.</p>
        </header>

        <section class="search-box">
            <label for="searchInput">Kyong Mying</label>
            <input
                id="searchInput"
                type="search"
                placeholder="Ni Omying ji erana..."
                autocomplete="off"
                spellcheck="false"
            >
            <div id="status" class="status">Start typing a name.</div>
        </section>

        <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
